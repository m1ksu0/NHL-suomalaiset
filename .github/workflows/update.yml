name: Päivitä suomalaiset NHL:ssä

on:
  schedule:
    - cron: "0 7 * * *"   # joka päivä 07:00 UTC (09:00 Suomen talviaikaa, 10:00 kesäaikaa)
  workflow_dispatch:       # voi ajaa käsin Actions-välilehdeltä

permissions:
  contents: write   # keepalive-vaihe tekee tarvittaessa tyhjän commitin
  pages: write
  id-token: write

concurrency:
  group: nhl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hae tiedot
        run: python fetch_data.py

      - name: Tee sivu
        run: python build_html.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub pysäyttää ajastukset, jos julkisessa repossa ei ole aktiivisuutta 60 päivään.
      # Jos viimeisin commit on yli 45 päivää vanha, tehdään tyhjä commit.
      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "Viimeisin commit on $age_days päivää vanha"
          if [ "$age_days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keepalive: tyhjä commit, jotta ajastus ei pysähdy"
            git push
          fi
